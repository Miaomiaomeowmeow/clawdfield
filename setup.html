<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>接 AI · 今日小克终未地</title>
<!-- 原创 / Original work: Miaomiao (GitHub: Miaomiaomeowmeow) · CC BY-NC-SA 4.0 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+SC:wght@400;500;900&display=swap">
<style>
  /* 和工作台同一套颜色（THEMES.base） */
  :root {
    --paper:#f2f2ee; --floor:#c4c5c0; --line:#a2a39c; --panel:#ffffff; --soft:#efefe9;
    --ink:#151513; --ink-2:#5d5e58; --ink-3:#8b8c85; --y:#ffe14a; --hl:#fff7cc; --red:#e2412b; --ok:#2f9e5b; --violet:#7b5cff;
    --f-cn:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --f-tech:"Chakra Petch","Noto Sans SC",ui-monospace,monospace;
    color-scheme:light;
  }
  * { box-sizing:border-box }
  [hidden] { display:none !important }
  body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.6 var(--f-cn); }
  :focus-visible { outline:3px solid var(--violet); outline-offset:2px }
  .tech { font-family:var(--f-tech); letter-spacing:.08em; }
  main { max-width:640px; margin:0 auto; padding:14px 16px 64px; }

  /* 顶栏：照工作台 */
  .top { display:flex; align-items:center; gap:10px; border-bottom:2px solid var(--ink); padding-bottom:8px; }
  .logo { width:22px; height:22px; flex:none; background:var(--ink); clip-path:polygon(0 0,70% 0,100% 30%,100% 100%,30% 100%,0 70%); position:relative; }
  .logo::after { content:""; position:absolute; inset:6px; background:var(--y); }
  .top b { font-size:20px; font-weight:900; letter-spacing:.08em; }
  .top .code { font-size:12px; color:var(--ink-2); }
  .top a { margin-left:auto; color:var(--ink); font-size:14px; text-decoration:none; border-bottom:1.5px solid var(--ink); white-space:nowrap; }
  .stripe { height:8px; margin:0 0 22px; background:repeating-linear-gradient(-45deg,var(--y) 0 10px,var(--ink) 10px 20px); }

  .sh { display:flex; align-items:baseline; gap:10px; margin:0 0 10px; }
  .sh h2 { margin:0; font-size:16px; font-weight:900; }
  .sh .en { font-size:11px; color:var(--ink-3); }
  .lead { margin:-4px 0 14px; color:var(--ink-2); font-size:13px; }

  /* 三张选择卡 */
  .opt { position:relative; display:block; background:var(--panel); border:2px solid var(--ink); padding:12px 14px 12px 18px; margin-bottom:12px; cursor:pointer; }
  .opt::before { content:""; position:absolute; left:-2px; top:-2px; bottom:-2px; width:8px; background:transparent; }
  .opt.on { box-shadow:8px 8px 0 color-mix(in srgb,var(--ink) 22%,transparent); }
  .opt.on::before { background:var(--y); border-right:2px solid var(--ink); }
  .row { display:flex; align-items:center; gap:6px 10px; flex-wrap:wrap; }
  .row input[type=radio] { width:18px; height:18px; margin:0; accent-color:var(--ink); }
  .row b { font-size:16px; font-weight:900; white-space:nowrap; }
  .no { font-size:11px; color:var(--ink-3); margin-left:auto; }
  .chip { font-size:11px; border:1.5px solid var(--ink); padding:0 6px; white-space:nowrap; }
  .chip.yes { background:var(--y); }
  .opt p { margin:2px 0 0 28px; color:var(--ink-2); font-size:13px; }
  .more { display:none; margin:12px 0 2px 28px; padding-top:10px; border-top:1.5px dashed var(--line); }
  .opt.on .more { display:block; }

  /* 表单：标签一栏固定宽 */
  .f { display:grid; grid-template-columns:72px 1fr; align-items:center; gap:8px 12px; margin-bottom:8px; }
  .f > span { font-size:12px; color:var(--ink-2); }
  .f small { grid-column:2; font-size:12px; color:var(--ink-3); margin-top:-4px; }
  select, input[type=text], input[type=password], input[type=number] {
    width:100%; font:16px/1.4 var(--f-cn); color:var(--ink); background:var(--soft);
    border:1.5px solid var(--ink); border-radius:0; padding:6px 9px; min-height:40px; }
  input.short { width:9em; }
  .more select { width:auto; min-width:14em; max-width:100%; }
  input.mono { font-family:var(--f-tech); font-size:15px; letter-spacing:.02em; }
  @media (max-width:520px) { .f { grid-template-columns:1fr; gap:2px; } .f small { grid-column:1; margin-top:0; } .opt p, .more { margin-left:0; } }

  .limit { margin-top:24px; }
  .limit .f { grid-template-columns:auto auto 1fr; }
  .limit .f small { grid-column:auto; margin-top:0; }
  @media (max-width:520px) { .limit .f { grid-template-columns:auto auto; } .limit .f small { grid-column:1 / -1; } }

  .bar { display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; }
  button { font:inherit; font-size:16px; font-weight:500; min-height:44px; padding:0 20px; border:2px solid var(--ink); background:var(--panel); color:var(--ink); cursor:pointer; border-radius:0; }
  button.main { background:var(--ink); color:#fff; }
  button.main:hover { background:#2a2a27; }
  button:disabled { opacity:.5; cursor:wait; }
  #msg { margin-top:16px; padding:10px 12px; background:var(--panel); border:2px solid var(--ink); border-left-width:8px; display:none; white-space:pre-wrap; font-size:14px; }
  #msg.ok { border-left-color:var(--ok); } #msg.bad { border-left-color:var(--red); } #msg.wait { border-left-color:var(--y); }
</style>
</head>
<body>
<main>
  <header class="top">
    <i class="logo"></i><b>接 AI</b><span class="code tech">AI LINK</span>
    <a href="/">← 回工作台</a>
  </header>
  <div class="stripe"></div>

  <div class="sh"><h2>选一种</h2><span class="en tech">SOURCE</span></div>
  <p class="lead">工作台里带 ✨ 的按钮（起名字、写性格、编八卦……）要用 AI。随时能回来换。</p>

  <div class="opt" data-src="cli">
    <div class="row"><input type="radio" name="src" value="cli" aria-label="借电脑上的 AI 助手"><b>借电脑上的 AI 助手</b><span class="chip" id="found"></span><span class="no tech">01</span></div>
    <p>用你已经登录的 Codex 或 Claude Code，不用 Key。</p>
    <div class="more">
      <label class="f"><span>用哪个</span>
        <select id="tool">
          <option value="codex">Codex</option>
          <option value="claude">Claude Code</option>
          <option value="custom">别的（自己写命令）</option>
        </select>
        <small>一次要等几秒到几十秒。问题不大：手机八卦这种只是偶尔跑一下。</small>
      </label>
      <label class="f" id="customBox" hidden><span>命令</span>
        <input type="text" id="command" class="mono" placeholder="gemini -p &quot;&quot;">
        <small>问题从“标准输入”传进去，回答从输出读出来。</small>
      </label>
    </div>
  </div>

  <div class="opt" data-src="api">
    <div class="row"><input type="radio" name="src" value="api" aria-label="用自己的 Key"><b>用自己的 Key</b><span class="chip yes" id="keyTag" hidden>Key 已填</span><span class="no tech">02</span></div>
    <p>按次数付钱给服务商，最快。</p>
    <div class="more">
      <label class="f"><span>服务商</span><select id="vendor"></select></label>
      <label class="f"><span>Key</span><input type="password" id="key" class="mono" autocomplete="off" placeholder="粘贴你的 Key">
        <small>只存在你自己电脑的 data/config.json，不会上传。</small></label>
      <label class="f"><span>普通模型</span><input type="text" id="model" class="mono"><small>大部分按钮用它。</small></label>
      <label class="f"><span>聪明模型</span><input type="text" id="smart" class="mono"><small>取名、排职位这种要动脑的用它；不填就跟普通的一样。</small></label>
      <label class="f"><span>地址</span><input type="text" id="base" class="mono"><small>一般不用改。</small></label>
    </div>
  </div>

  <div class="opt" data-src="none">
    <div class="row"><input type="radio" name="src" value="none" aria-label="先不用"><b>先不用</b><span class="no tech">03</span></div>
    <p>带 ✨ 的按钮会提示“AI 还没接上”，别的照常用。</p>
  </div>

  <section class="limit">
    <div class="sh"><h2>用量上限</h2><span class="en tech">DAILY LIMIT</span></div>
    <label class="f"><span>每天最多</span><input type="number" id="limit" class="short mono" min="0" max="100000" step="10"><small id="used"></small></label>
  </section>

  <div class="bar">
    <button class="main" id="test">保存并试一下</button>
    <button id="save">只保存</button>
  </div>
  <div id="msg" role="status"></div>
</main>
<script>
  const VENDORS = [
    // id, 名字, 格式, 地址, 普通模型, 聪明模型
    ["claude", "Claude（Anthropic）", "anthropic", "https://api.anthropic.com", "claude-opus-5-5", "claude-opus-5-5"],
    ["openai", "OpenAI", "openai", "https://api.openai.com/v1", "", ""],
    ["gemini", "Gemini（Google）", "gemini", "https://generativelanguage.googleapis.com/v1beta", "", ""],
    ["deepseek", "DeepSeek", "openai", "https://api.deepseek.com/v1", "deepseek-chat", ""],
    ["kimi", "Kimi（月之暗面）", "openai", "https://api.moonshot.cn/v1", "", ""],
    ["qwen", "通义千问", "openai", "https://dashscope.aliyuncs.com/compatible-mode/v1", "", ""],
    ["doubao", "豆包（火山方舟）", "openai", "https://ark.cn-beijing.volces.com/api/v3", "", ""],
    ["openrouter", "OpenRouter", "openai", "https://openrouter.ai/api/v1", "", ""],
    ["ollama", "Ollama（电脑上自己跑，不用 Key）", "openai", "http://localhost:11434/v1", "", ""],
    ["other", "别的（OpenAI 格式）", "openai", "", "", ""],
  ];
  const $ = s => document.querySelector(s);
  const H = { "Content-Type": "application/json", "X-Clawdfield": "1" };
  const vsel = $("#vendor");
  VENDORS.forEach(v => vsel.add(new Option(v[1], v[0])));

  function pick(src) {
    document.querySelectorAll(".opt").forEach(o => {
      const on = o.dataset.src === src;
      o.classList.toggle("on", on);
      o.querySelector("input[type=radio]").checked = on;
    });
  }
  document.querySelectorAll(".opt").forEach(o => o.addEventListener("click", () => pick(o.dataset.src)));

  function fillVendor(keep) {
    const v = VENDORS.find(x => x[0] === vsel.value) || VENDORS[0];
    if (!keep || !$("#base").value) $("#base").value = v[3];
    $("#model").placeholder = v[4] || "填服务商给的模型名";
    $("#smart").placeholder = v[5] || "可以不填";
    if (!keep) { $("#model").value = v[4]; $("#smart").value = v[5]; }
  }
  vsel.onchange = () => fillVendor(false);
  $("#tool").onchange = () => { $("#customBox").hidden = $("#tool").value !== "custom"; };

  async function load() {
    const cfg = await (await fetch("/api/ai/config")).json();
    pick(["cli", "api", "none"].includes(cfg.source) ? cfg.source : "none");
    $("#tool").value = cfg.cli.tool || "codex"; $("#tool").onchange();
    $("#command").value = cfg.cli.command || "";
    vsel.value = cfg.api.vendor || "claude";
    $("#base").value = cfg.api.base || ""; $("#model").value = cfg.api.model || ""; $("#smart").value = cfg.api.smartModel || "";
    fillVendor(true);
    if (!cfg.api.model) { const v = VENDORS.find(x => x[0] === vsel.value); $("#model").value = v[4]; $("#smart").value = v[5]; }
    $("#key").placeholder = cfg.api.hasKey ? `已经填过了（尾号 ${cfg.api.keyTail || "****"}），不换就空着` : "粘贴你的 Key";
    $("#keyTag").hidden = !cfg.api.hasKey;
    const f = cfg.found || {}, names = [f.codex && "Codex", f.claude && "Claude Code"].filter(Boolean);
    $("#found").textContent = names.length ? "找到 " + names.join(" · ") : "电脑上没找到";
    $("#found").className = "chip tech" + (names.length ? " yes" : "");
    $("#limit").value = cfg.dailyLimit ?? 200;
    $("#used").textContent = `次 · 今天用了 ${cfg.usedToday || 0} 次 · 填 0 = 不限`;
  }

  function say(text, kind) { const m = $("#msg"); m.textContent = text; m.className = kind; m.style.display = "block"; }

  async function save() {
    const v = VENDORS.find(x => x[0] === vsel.value) || VENDORS[0];
    const body = {
      source: document.querySelector("input[name=src]:checked").value,
      cli: { tool: $("#tool").value, command: $("#command").value.trim() },
      api: { vendor: v[0], kind: v[2], base: $("#base").value.trim(), model: $("#model").value.trim(), smartModel: $("#smart").value.trim(), key: $("#key").value.trim() },
      dailyLimit: Math.max(0, parseInt($("#limit").value || "0", 10) || 0),
    };
    const r = await fetch("/api/ai/config", { method: "POST", headers: H, body: JSON.stringify(body) });
    if (!r.ok) throw new Error("没存上");
    $("#key").value = "";
    await load();
  }

  $("#save").onclick = async () => { try { await save(); say("存好了。回工作台点 ✨ 按钮就会用这个。", "ok"); } catch (e) { say("没存上：" + e.message, "bad"); } };
  $("#test").onclick = async () => {
    const b = $("#test"); b.disabled = true; say("正在问 AI……借 AI 助手的话要等一会儿。", "wait");
    try {
      await save();
      if (document.querySelector("input[name=src]:checked").value === "none") { say("存好了：先不用 AI。", "ok"); b.disabled = false; return; }
      const j = await (await fetch("/api/ai/test", { method: "POST", headers: H, body: "{}" })).json();
      await load();
      if (j.ok) say(`接上了，用了 ${j.seconds} 秒。AI 说：${(j.value && j.value.hi) || JSON.stringify(j.value)}`, "ok");
      else say("没接上：" + (j.message || j.code), "bad");
    } catch (e) { say("没接上：" + e.message, "bad"); }
    b.disabled = false;
  };
  load().catch(() => say("读不到设置：本机小程序是不是关了？双击 start.bat 再刷新。", "bad"));
</script>
</body>
</html>
