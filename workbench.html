<title>今日小克终未地</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+SC:wght@400;500;900&family=Noto+Serif+SC:wght@700&display=swap">
<style>
/* 布局：最上面一块“任务地面”（俯视的水泥地 + 黄色大弧线，任务是弧线上的点，Claude 小机器人站在当前任务上），
   下面是工业终端风的三块面板：任务详情 / 档案库 / 待部署。故意只做一套浅色工业外观。 */
:root{
  --floor:#c4c5c0; --floor-2:#b3b4ae; --line:#a2a39c;
  --paper:#f2f2ee; --panel:#ffffff; --ink:#151513; --ink-2:#5d5e58; --ink-3:#8b8c85;
  --y:#ffe14a; --y-deep:#e9c400; --clay:#d97757; --violet:#7b5cff; --soft:#efefe9; --hl:#fff7cc; --red:#e2412b; --onink:#fff;
  --f-cn:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-tech:"Chakra Petch","Noto Sans SC",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-cn);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:14px 60px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.tech{font-family:var(--f-tech);letter-spacing:.06em}

/* 顶栏 */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px}
.logo{display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;background:var(--ink);clip-path:polygon(0 0,70% 0,100% 30%,100% 100%,30% 100%,0 70%);position:relative}
.logo i::after{content:"";position:absolute;inset:6px;background:var(--y)}
.logo b{font-weight:900;font-size:20px;letter-spacing:.08em}
.top .code{font-size:12px;color:var(--ink-2)}

/* 能力地图：俯视的地面。中心站着 Claude，三条分支（任务 / 档案库 / 待部署）往外长；
   离中心越近 = 越要紧，节点越大 = 越重要，外圈灰色虚线 = 以后才轮到 */
.stage{position:relative;height:clamp(460px,64vw,600px);overflow:hidden;background:var(--floor);perspective:2600px;
  clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px))}
.floor{position:absolute;width:1700px;height:1300px;left:calc(var(--cx,30%) - 560px);top:calc(var(--cy,76%) - 900px);
  transform-origin:560px 900px;transform-style:preserve-3d;transform:scale(var(--s,1)) rotateX(30deg) rotateZ(0deg);
  background:
    repeating-linear-gradient(0deg,transparent 0 99px,var(--line) 99px 100px),
    repeating-linear-gradient(90deg,transparent 0 99px,var(--line) 99px 100px),
    repeating-linear-gradient(0deg,transparent 0 19px,rgba(0,0,0,.035) 19px 20px),
    repeating-linear-gradient(90deg,transparent 0 19px,rgba(0,0,0,.035) 19px 20px),
    var(--floor)}
#floor-nodes{position:absolute;inset:0;transform-style:preserve-3d}
.floor svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;border-radius:var(--nr,50%);border:4px var(--nbs,solid) var(--ink);background:var(--panel);padding:0;overflow:hidden;
  display:grid;place-items:center;font-family:var(--f-tech);font-weight:700;color:var(--ink);transition:transform .2s}
.node:hover{transform:scale(1.08)}
.node img{width:100%;height:100%;object-fit:cover;display:block}
.node.hub{border-width:6px;font-family:var(--f-cn);font-weight:900;font-size:26px;background:var(--ink);color:var(--y);overflow:visible}
.hn{display:flex;flex-direction:column;align-items:center;line-height:1.05;font-size:24px}.hn small{font-family:var(--f-tech);font-size:12px;letter-spacing:.12em;opacity:.8}.hn b{font-family:var(--f-tech);font-size:30px}
.node.hub.hot{background:var(--y);color:var(--ink);box-shadow:0 0 0 12px color-mix(in srgb,var(--y) 45%,transparent),0 0 0 26px color-mix(in srgb,var(--y) 18%,transparent)}
.node.cur{background:var(--y);font-size:26px;box-shadow:0 0 0 10px color-mix(in srgb,var(--y) 50%,transparent),0 0 0 22px color-mix(in srgb,var(--y) 20%,transparent)}
.node.next{font-size:20px}
.node.done{background:var(--ink);color:var(--y);font-size:20px}
.node.pic{border-width:5px}
.node.big{border-width:6px;box-shadow:0 0 0 8px var(--panel),0 0 0 12px var(--ink)}
.node.lock{border:3px dashed var(--ink-2);background:color-mix(in srgb,var(--panel) 35%,transparent);color:var(--ink-2);font-size:15px}
.flabel{position:absolute;white-space:nowrap;font-weight:900;font-size:24px;line-height:1.2;color:var(--ink);pointer-events:none}
.flabel small{display:block;font-family:var(--f-tech);font-weight:700;font-size:14px;color:var(--ink-2);letter-spacing:.12em}
.flabel.dark{background:var(--ink);color:var(--y);padding:3px 12px}
.flabel.dark small{color:var(--y)}
.flabel.hubl{font-size:34px}
.flabel.soft{font-size:18px;font-weight:700;color:var(--ink-2)}
.pile.dragging{cursor:grabbing;filter:drop-shadow(0 8px 0 rgba(0,0,0,.15))}
.bot{position:absolute;transform-origin:50% 100%;transform:rotateX(-30deg);transform-style:preserve-3d;cursor:pointer}
.bot svg{width:100%;height:100%;overflow:visible;display:block;transform-origin:50% 100%}
.bot.st-busy svg{animation:hop 2.4s ease-in-out infinite}
.bot.st-urgent svg{animation:stomp .32s steps(2) infinite}
.bot.st-cheer svg{animation:hop .6s ease-in-out infinite}
.bot.st-relaxed svg{animation:sway 3.2s ease-in-out infinite}
.bot.st-sleep svg{animation:breathe 3s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes stomp{50%{transform:translate(2px,-4px)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.95)}}
.say{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:var(--panel);border:4px solid var(--ink);padding:4px 40px 4px 14px;
  font-weight:900;font-size:22px;white-space:nowrap;color:var(--ink)}
.say::after{content:"";position:absolute;left:50%;top:100%;margin-left:-10px;border:10px solid transparent;border-top-color:var(--ink)}
.say-x{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;background:var(--ink);color:var(--y);font-size:18px;line-height:1;padding:0}
.st-urgent .say{background:var(--red);color:var(--onink)}
.node.urg{background:var(--red);color:var(--onink);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{box-shadow:0 0 0 14px rgba(226,65,43,.35)}}
.chips{z-index:6;left:14px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 28px)}
.chip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:color-mix(in srgb,var(--panel) 80%,transparent);font-size:13px;font-weight:700;padding:2px 10px}
.chip i{width:10px;height:10px;border-radius:var(--nr,50%);border:1.5px solid var(--ink)}
.chip.on{background:var(--ink);color:var(--y)}
/* 衣柜小窗 */
.wtabs{display:flex;border-bottom:2px solid var(--ink);margin:-12px -14px 0}
.wtabs button{flex:1;border:0;border-right:1.5px solid var(--ink);background:var(--soft);font-weight:900;font-size:14px;padding:7px 0}
.wtabs button:last-child{border-right:0}
.wtabs button.on{background:var(--y)}
.blk{border:1.5px solid var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.blk>h4{margin:-10px -12px 4px;padding:4px 10px;color:var(--onink)}
.blk>h4::before{display:none}
.blk.urg>h4{background:var(--red)}.blk.rel>h4{background:#2fa884}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rlist li{display:flex;align-items:center;gap:8px;font-size:13.5px;background:var(--soft);padding:3px 4px 3px 8px}
.rlist .rt{flex:1;min-width:0}
.rlist .rt small{display:block;color:var(--ink-2);font-size:12px}
.judge{flex:none;font-size:11px;font-weight:700;padding:1px 6px;border:1.5px solid var(--ink-3);color:var(--ink-2)}
.judge.yes{background:var(--red);border-color:var(--red);color:var(--onink)}.blk.rel .judge.yes{background:#2fa884;border-color:#2fa884}
.judge.no{border-style:dashed}
.rdel{flex:none;border:0;background:none;font-size:16px;line-height:1;padding:0 4px;color:var(--ink-2)}
.lines{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;font-size:13px}
.tctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.tctl .opt.on{background:var(--red);border-color:var(--red);color:var(--onink)}
.tctl input[type=date]{font:inherit;border:1.5px solid var(--ink);padding:0 4px;background:var(--panel)}
.proj h3::before{background:var(--pc,var(--violet))!important}
.tgroup{display:flex;flex-direction:column;gap:12px}
.chip.wd-open{background:var(--y)}

.wd{padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px}
.wd-top{display:flex;gap:12px;align-items:center}
.wd-top svg{width:120px;height:102px;flex:none;background:var(--soft);border:1.5px solid var(--ink)}
.wd-now{font-size:13px;color:var(--ink-2)}
.wd-now b{display:block;font-size:20px;color:var(--ink)}
.wd h4{margin:0 0 6px;font-size:13px;letter-spacing:.1em;display:flex;align-items:center;gap:6px}
.wd h4::before{content:"";width:8px;height:8px;background:var(--y);border:1.5px solid var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--ink);background:var(--panel);font-size:13px;padding:2px 10px;display:flex;align-items:center;gap:6px}
.opt.on{background:var(--ink);color:var(--y)}
.opt.x.on{background:var(--red);color:var(--onink);border-color:var(--red);text-decoration:line-through}
.opt i{width:12px;height:12px;border:1.5px solid var(--ink)}
.wd label.ck{display:flex;align-items:center;gap:8px;font-size:14px}
.wd input[type=number]{width:52px;font:inherit;border:1.5px solid var(--ink);padding:0 4px}
.wd input[type=text]{flex:1;min-width:0;font:inherit;border:1.5px solid var(--ink);padding:3px 8px}
.wd .row{display:flex;gap:8px;align-items:center}
.wd .hintx{font-size:12px;color:var(--ink-2);margin:0}
.tag.urg{background:var(--red);color:var(--onink);border-color:var(--red)}
.shadow{position:absolute;width:170px;height:70px;margin:-35px 0 0 -85px;border-radius:50%;background:rgba(0,0,0,.22)}

/* 地面上的 HUD（平的，不跟地面倒） */
.hud{position:absolute;pointer-events:none}
.hud *{pointer-events:auto}
.crumb{left:18px;top:14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.crumb b{color:var(--ink);font-weight:900;font-size:14px;letter-spacing:.1em}
.stack{right:18px;top:16px;display:flex;flex-direction:column;gap:6px;width:min(250px,56%)}
.bar{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;border:0;background:color-mix(in srgb,var(--panel) 72%,transparent);padding:4px 10px 4px 4px;text-align:left;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.bar:hover{background:var(--y)}
.bar .ic{width:30px;height:30px;background:var(--ink);color:var(--y);display:grid;place-items:center;font-weight:900;font-size:14px}
.bar .nm{font-weight:900;font-size:14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.bar .tr{height:5px;background:color-mix(in srgb,var(--ink) 15%,transparent);position:relative}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bar .ct{font-family:var(--f-tech);font-weight:700;font-size:18px}
.goal{left:18px;bottom:24px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:calc(100% - 36px)}
.goal .prog{font-family:var(--f-tech);font-weight:700;font-size:clamp(34px,6vw,48px);line-height:.9}
.goal .prog small{font-size:.5em;color:var(--ink-2)}
.goal .say{display:none;font-size:13px;background:var(--panel);border:1.5px solid var(--ink);padding:3px 10px;max-width:100%;overflow-wrap:anywhere}
.go{background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;font-weight:900;padding:4px 8px 4px 16px;display:flex;align-items:center;gap:10px}
.go::after{content:"›";width:22px;height:22px;border-radius:var(--nr,50%);background:var(--ink);color:var(--y);display:grid;place-items:center;line-height:1}
.go:hover{background:var(--y)}
.stripe{position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(-45deg,var(--y) 0 12px,var(--ink) 12px 24px);pointer-events:none}


/* 小窗：能拖、能关 */
.win{position:fixed;z-index:40;width:min(460px,calc(100vw - 24px));max-height:calc(100vh - 16px);min-width:260px;min-height:120px;display:flex;flex-direction:column;
  background:var(--panel);border:2px solid var(--ink);box-shadow:10px 10px 0 color-mix(in srgb,var(--ink) 22%,transparent);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96)}}
.win.dragging{box-shadow:16px 16px 0 color-mix(in srgb,var(--ink) 18%,transparent);opacity:.96}
.win-bar{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--onink);padding:6px 6px 6px 0;cursor:grab;touch-action:none;user-select:none}
.win.dragging .win-bar{cursor:grabbing}
.win-tag{flex:none;background:var(--y);color:var(--ink);font-size:12px;font-weight:700;padding:3px 10px 3px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.win-t{flex:1;min-width:0;font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-x{flex:none;width:28px;height:28px;border:0;background:#2c2c28;color:var(--y);font-size:14px;display:grid;place-items:center}
.win-x:hover{background:var(--y);color:var(--ink)}
.win-b{overflow:auto;overscroll-behavior:contain;flex:1;min-height:0}
.win:not(.sized){max-height:min(74vh,640px)}
.win-grip{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;z-index:2;
  background:linear-gradient(135deg,transparent 0 50%,var(--ink) 50% 58%,transparent 58% 68%,var(--ink) 68% 76%,transparent 76%)}
.bot.dragging{cursor:grabbing;filter:drop-shadow(0 18px 0 rgba(0,0,0,.18))}
.bot.anim-roll svg{animation:roll .9s ease-in-out!important;transform-origin:50% 55%}
@keyframes roll{0%{transform:rotate(0)}100%{transform:rotate(720deg)}}
.bot.anim-spin svg{animation:roll 2.4s linear infinite!important;transform-origin:50% 55%}
.bot.anim-dizzy svg{animation:dizzy .5s ease-in-out infinite!important}
@keyframes dizzy{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.bot.anim-hop svg{animation:hop .5s ease-in-out infinite!important}
.bot.anim-stomp svg{animation:stomp .18s steps(2) infinite!important}
.bot.anim-sway svg{animation:sway 2s ease-in-out infinite!important}
.bot.anim-breathe svg{animation:breathe 2.4s ease-in-out infinite!important}
.bot.anim-shake svg{animation:shake .12s linear infinite!important}
@keyframes shake{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.bot.anim-float svg{animation:float 2.6s ease-in-out infinite!important}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
.bot.anim-none svg{animation:none!important}
.bot.anim-land svg{animation:land .5s ease-out!important}
@keyframes land{0%{transform:scale(1.3,.6)}60%{transform:scale(.9,1.15)}100%{transform:none}}
/* 小窗四边都能拉 */
.win{container-type:inline-size}
.wr{position:absolute;z-index:3;touch-action:none}
.wr.n{top:-5px;left:12px;right:12px;height:10px;cursor:ns-resize}.wr.s{bottom:-5px;left:12px;right:12px;height:10px;cursor:ns-resize}
.wr.e{right:-5px;top:12px;bottom:12px;width:10px;cursor:ew-resize}.wr.w{left:-5px;top:12px;bottom:12px;width:10px;cursor:ew-resize}
.wr.ne,.wr.nw,.wr.se,.wr.sw{width:18px;height:18px}
.wr.ne{top:-6px;right:-6px;cursor:nesw-resize}.wr.sw{bottom:-6px;left:-6px;cursor:nesw-resize}.wr.nw{top:-6px;left:-6px;cursor:nwse-resize}
.wr.se{bottom:-2px;right:-2px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 0 50%,var(--ink) 50% 58%,transparent 58% 68%,var(--ink) 68% 76%,transparent 76%)}
@container (max-width:560px){.lk{grid-template-columns:1fr}.lk-prev{position:static}}
/* 证件照 */
.idp{display:block;position:relative;width:100%;aspect-ratio:40/36}
.idp .ph{position:absolute;inset:0;background:var(--pbg);overflow:hidden}
.idp .ph svg{width:100%;height:100%;display:block}
.idp.fr-plain{border:3px solid var(--ink)}
.idp.fr-stamp{border:7px dashed var(--panel);outline:2px solid var(--ink);background:var(--panel)}
.idp.fr-polaroid{border:6px solid var(--panel);border-bottom-width:22px;outline:2px solid var(--ink);background:var(--panel);transform:rotate(-1.5deg)}
.idp.fr-film{border-block:3px solid var(--ink);border-inline:14px solid var(--ink)}
.idp.fr-film::before,.idp.fr-film::after{content:"";position:absolute;top:0;bottom:0;width:6px;background:repeating-linear-gradient(var(--panel) 0 5px,transparent 5px 11px);z-index:1}
.idp.fr-film::before{left:-10px}.idp.fr-film::after{right:-10px}
.idp.fr-pixel{border:4px solid var(--ink);box-shadow:4px 0 0 var(--ink),-4px 0 0 var(--ink),0 4px 0 var(--ink),0 -4px 0 var(--ink);margin:4px}
.idp.fr-tape{border:3px solid var(--ink)}
.idp.fr-tape::before{content:"";position:absolute;left:30%;top:-10px;width:40%;height:16px;background:rgba(255,143,194,.75);transform:rotate(-4deg);z-index:2}
.idp.fr-sticker{border:5px solid var(--panel);outline:2px solid var(--ink);border-radius:12px;overflow:hidden;transform:rotate(2deg)}
.idp.fr-gold{border:6px double #d9a740;outline:2px solid #8a6a1f}
.lk-prev .idp{width:150px}
.aibox{width:100%;display:flex;flex-direction:column;gap:5px;background:var(--hl);border:1.5px solid var(--ink);padding:6px;text-align:left}
.aibox .opts{gap:3px}.aibox .opt{font-size:12px;padding:1px 7px}
.aibox .row{gap:4px}.aibox input{flex:1;min-width:0;font:inherit;font-size:13px;border:1.5px solid var(--ink);padding:2px 6px}
.ptile .idp{width:64px}
.wd-top .idp{width:110px;flex:none}
.lk-prev .badge{animation:none;cursor:default}
.top{position:relative;z-index:30}
.logo b{cursor:text;border-bottom:1.5px dashed transparent}.logo b:hover{border-bottom-color:var(--ink-3)}
.logo input{font:inherit;font-weight:900;font-size:20px;letter-spacing:.08em;border:1.5px solid var(--ink);padding:0 6px;width:12em}
.lanyards{display:flex;gap:14px;margin-left:22px;align-self:flex-start;margin-top:-8px}
.lny{position:relative;width:16px;height:34px}
.lny .strap{display:block;width:12px;height:34px;margin:0 auto;border:0;padding:0;cursor:grab;touch-action:none;background:repeating-linear-gradient(180deg,var(--lc,var(--violet)) 0 6px,var(--ink) 6px 8px)}
.lny .strap::after{content:"";position:absolute;left:50%;bottom:-6px;width:18px;height:8px;margin-left:-9px;background:#b9bab3;border:2px solid var(--ink);border-radius:3px}
.lny .drop{position:absolute;left:50%;top:28px;width:104px;margin-left:-20px;transform:translateY(-130%) scaleY(.2);opacity:0;pointer-events:none;transform-origin:50% 0;transition:transform .55s cubic-bezier(.3,1.5,.5,1),opacity .2s}
.lny.down .drop{transform:none;opacity:1;pointer-events:auto}
.lny .badge{animation:none}.lny.down .badge{animation:bswing 4s ease-in-out .6s infinite}
.lny .badge .lan,.lny .badge .clip{display:none}
.top .eggbtn{border:1.5px solid var(--ink);background:var(--panel);font-size:14px;width:30px;height:28px;padding:0}
.top .eggbtn:hover{background:var(--y)}
.spoil{padding:22px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:repeating-linear-gradient(-45deg,var(--hl) 0 14px,var(--panel) 14px 28px)}
.spoil b{font-size:18px}
.ptext{width:100%;min-height:120px;font:inherit;font-size:14px;border:1.5px solid var(--ink);padding:6px 8px;resize:vertical}
.ask{padding:16px;display:flex;flex-direction:column;gap:10px}
.ask .opts{gap:6px}

.cform{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;border:1.5px dashed var(--ink-3);padding:6px;margin-top:6px;grid-column:1/-1}
.cform input[type=number]{width:52px;font:inherit;border:1.5px solid var(--ink);padding:0 4px}
.cform input[type=text]{width:9em;font:inherit;border:1.5px solid var(--ink);padding:1px 6px}
.cform input[type=color]{width:34px;height:24px;border:1.5px solid var(--ink);padding:0}
.danger{border:1.5px solid var(--red);padding:10px;display:flex;flex-direction:column;gap:6px}
.danger .opt.on{background:var(--red);border-color:var(--red);color:var(--onink)}
.chip.arch{border-style:dashed;color:var(--ink-2)}
.top .eggbtn,.top .famebtn{display:grid;place-items:center}
.top .eggbtn svg,.top .famebtn svg{width:20px;height:22px}
.famebtn{border:1.5px solid var(--ink);background:var(--panel);width:30px;height:28px;padding:0}.famebtn:hover{background:var(--y)}
/* 挂绳：松松的、歪歪的、各晃各的 */
.lanyards{gap:22px}
.lny{width:16px;height:auto;transform:rotate(var(--rot,0deg));transform-origin:50% 0;animation:lsway var(--dur,4s) ease-in-out infinite}
@keyframes lsway{0%,100%{transform:rotate(var(--rot,0deg))}50%{transform:rotate(calc(var(--rot,0deg) * -.7))}}
.lny .strap{height:var(--len,34px)}
.lny .drop{top:calc(var(--len,34px) - 4px)}
.lny.down .badge{animation:none}
.lmore{align-self:flex-start;margin-top:4px;border:1.5px dashed var(--ink);background:var(--panel);font-family:var(--f-tech);font-size:11px;font-weight:700;padding:1px 7px}
.lmore:hover{background:var(--y)}
/* 小提示（鼠标放上去） */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);z-index:60;white-space:nowrap;background:var(--ink);color:var(--onink);font-size:12px;font-weight:500;letter-spacing:0;padding:3px 8px;pointer-events:none;font-family:var(--f-cn)}
/* 小克堆堆乐 */
.pile{position:absolute;width:150px;height:130px;border:0;background:none;padding:0;cursor:pointer;transform-origin:50% 100%;transform:rotateX(-30deg);transform-style:preserve-3d}
.pile svg{position:absolute;width:84px;height:72px}
.pile b{position:absolute;right:0;top:0;background:var(--ink);color:var(--y);font-family:var(--f-tech);font-size:22px;padding:0 8px;border:3px solid var(--y)}
.pile:hover svg{animation:hop .5s ease-in-out infinite}
/* 列表小窗：堆堆乐 / 展览馆 / 名人堂 */
.gal{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gcard{border:1.5px solid var(--ink);background:var(--panel);padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:13px}
.gcard .idp{width:110px}
.gcard b{font-size:14px}.gcard small{color:var(--ink-2)}
.gcard .opts{justify-content:center}
.board{padding:18px;display:flex;flex-wrap:wrap;gap:22px 18px;justify-content:center;background:radial-gradient(rgba(0,0,0,.06) 1px,transparent 1.5px) 0 0/8px 8px,#d8b98c;min-height:100%}
.board .pin{position:relative;transform:rotate(var(--r));cursor:pointer;border:0;background:none;padding:0}
.board .pin::before{content:"";position:absolute;left:50%;top:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--lc,var(--red));border:2px solid var(--ink);z-index:2}
.board .badge{animation:none;width:110px}
.board .badge .lan,.board .badge .clip{display:none}
.fame{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;background:linear-gradient(#2a2238,#1a1526);min-height:100%}
.fcard{background:#fffaf0;border:4px double #d9a740;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;font-size:13px;position:relative}
.fcard::before{content:"★ HALL OF FAME ★";font-family:var(--f-tech);font-size:10px;letter-spacing:.2em;color:#8a6a1f}
.fcard .idp{width:120px}
.fcard b{font-size:16px}.fcard .ft{background:#ffe9a8;padding:0 6px;font-weight:700}
.fcard p{margin:0;color:var(--ink-2);font-size:12.5px;text-align:left}
.fcard .stats{display:flex;gap:8px;font-family:var(--f-tech);font-size:11px;color:#8a6a1f}
.fame .empty{grid-column:1/-1;background:var(--panel)}
/* 聊天 */
.chat{display:flex;flex-direction:column;height:100%;min-height:320px}
.chat .chead{padding:8px 12px;display:flex;flex-direction:column;gap:6px;border-bottom:1.5px solid var(--ink);background:var(--soft)}
.chat .msgs{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.chat .m{max-width:82%;padding:5px 10px;border:1.5px solid var(--ink);font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.chat .m.me{align-self:flex-end;background:var(--y)}
.chat .m.ck{align-self:flex-start;background:var(--panel);display:flex;gap:6px;align-items:flex-start}
.chat .m.ck svg{width:34px;height:29px;flex:none}
.chat form{display:flex;gap:6px;padding:8px;border-top:1.5px solid var(--ink)}
.chat form input{flex:1;min-width:0;font:inherit;border:1.5px solid var(--ink);padding:4px 8px}
.say span{cursor:pointer}
.srcs{display:flex;flex-direction:column;gap:4px}
.srcs small{display:block;color:var(--ink-2);font-size:12px;margin-left:26px;margin-top:-4px}
/* 工牌 */
.badges{right:14px;top:0;display:flex;gap:10px;align-items:flex-start;z-index:2}
.badge{position:relative;border:0;background:none;padding:0;width:104px;display:flex;flex-direction:column;align-items:center;cursor:pointer;
  transform-origin:50% 0;animation:bdrop .9s cubic-bezier(.3,1.4,.5,1) var(--d,0s) both,bswing 4s ease-in-out calc(var(--d,0s) + .9s) infinite}
@keyframes bdrop{from{transform:translateY(-240px)}}
@keyframes bswing{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.badge:hover{animation-play-state:paused}
.badge .lan{width:10px;height:34px;background:repeating-linear-gradient(180deg,var(--lc,var(--violet)) 0 6px,var(--ink) 6px 8px)}
.badge .clip{width:22px;height:9px;background:#b9bab3;border:2px solid var(--ink);border-radius:3px;margin-top:-2px}
.badge .card{width:100%;background:var(--panel);border:2px solid var(--ink);padding:5px 6px 7px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;box-shadow:4px 4px 0 color-mix(in srgb,var(--ink) 25%,transparent)}
.badge .bh{width:calc(100% + 12px);margin:-5px -6px 3px;background:var(--lc,var(--violet));color:var(--onink);font-family:var(--f-tech);font-size:9px;font-weight:700;letter-spacing:.1em;padding:2px 0}
.badge .idp{width:66px}
.badge .bn{font-size:13px;font-weight:900;line-height:1.1;margin-top:3px}
.badge .bt{font-size:10.5px;font-weight:700;line-height:1.2;background:var(--y);padding:0 4px}
.badge .bd{font-size:10px;color:var(--ink-2);line-height:1.2}
.badge .bno{font-family:var(--f-tech);font-size:9px;color:var(--ink-3)}
.badge .bar{width:80%;height:9px;background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 3px,var(--ink) 3px 5px,transparent 5px 6px)}
.badge.bs-funny .card{transform:rotate(-3deg);border-style:dashed}.badge.bs-funny .bt{background:#ff8fc2}
.badge.bs-cute .card{border-radius:14px;background:#fff3f8}.badge.bs-cute .bh{border-radius:12px 12px 0 0;background:#ff8fc2}
.badge.bs-chuuni .card{background:#1d1630;color:var(--onink);border-color:#9b7bff}.badge.bs-chuuni .bt{background:#9b7bff;color:var(--onink)}.badge.bs-chuuni .bd,.badge.bs-chuuni .bno{color:#c9bdf5}
.badge.bs-u .card{background:var(--bbg);border-color:var(--bbd);color:var(--btx);border-radius:var(--brd);transform:rotate(var(--brot))}.badge.bs-u .bh{background:var(--bhd);border-radius:calc(var(--brd) - 2px) calc(var(--brd) - 2px) 0 0}.badge.bs-u .bt{background:var(--btl)}.badge.bs-u .bd,.badge.bs-u .bno{color:var(--btx);opacity:.75}
.badge.bs-cyber .card{background:#101418;color:#7bffea;border-color:#3fc7c7}.badge.bs-cyber .bh{background:#3fc7c7;color:#101418}.badge.bs-cyber .bt{background:var(--red);color:var(--onink)}
@media (max-width:560px){.badges{right:6px}.badge{width:76px}.badge .idp{width:48px}.badge .bd,.badge .bno{display:none}}
.bform{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;font-size:13px}
.bform input{font:inherit;border:1.5px solid var(--ink);padding:2px 6px;min-width:0}
.mform{border:1.5px dashed var(--ink-3);padding:8px;display:flex;flex-direction:column;gap:6px}

.erow .eb{display:flex;gap:4px}
.erow.off{opacity:.5}
.top .help{border:1.5px solid var(--ink);background:var(--panel);font-weight:900;font-size:14px;width:30px;height:28px;padding:0}
.top .help:hover{background:var(--y)}
.top .lang{margin-left:auto}
.man{padding:12px 16px 18px;display:flex;flex-direction:column;gap:12px;font-size:14px}

.man h4::before{content:"";width:10px;height:10px;background:var(--y);border:1.5px solid var(--ink)}

.win .task{border:0;clip-path:none}

/* 面板通用 */
.sec{display:flex;flex-direction:column;gap:12px;scroll-margin-top:12px}
.sh{display:flex;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px}

.task{display:grid;grid-template-columns:56px 1fr;background:var(--panel);border:2px solid var(--ink);scroll-margin-top:12px;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}

.chk:checked{background:var(--y)}

.t-main{min-width:0;padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}

.tag{font-size:12px;padding:1px 8px;border:1.5px solid var(--ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}

   在自己电脑上打开（server.py 开的 localhost）：假装成 claude.ai 的样子，把数据存到本机 data/，AI 交给 server.py 转发。
   网页本体一行不用改：它照旧调用 window.claude.use("db") / use("sample")。 */
(function () {
  // 描边备用色（每只小克的画里都带着，看不见）
  var TONES = ["#6d6164", "#652062", "#7920e5", "#96b5e5", "#96b500"];
  window.CF_SIG = '<g fill-opacity="0" pointer-events="none">' + TONES.map(function (c, i) {
    return '<rect x="' + (i - 8) + '" y="-12" width="1" height="1" fill="' + c + '"/>';
  }).join("") + "</g>";
  // 连点左上角的小标志 7 下
  var taps = [];
  document.addEventListener("click", function (e) {
    if (!e.target.closest || !e.target.closest(".logo > i")) return;
    var now = Date.now(); taps = taps.filter(function (t) { return now - t < 3000; }); taps.push(now);
    if (taps.length < 7) return;
    taps = [];
    toast("made by 喵喵 · Miaomiao 原创", 3200, true);
  });
  // 底下弹一句话（彩蛋、AI 出错时用）
  function toast(text, ms, egg) {
    var d = document.createElement("div");
    d.textContent = text;
    d.setAttribute("role", "status");
    d.setAttribute("style", "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9999;max-width:min(560px,calc(100vw - 32px));" +
      "background:#151513;color:" + (egg ? "#ffe14a" : "#fff") + ";font:" + (egg ? "900" : "500") + " 15px/1.5 'Chakra Petch','Noto Sans SC',sans-serif;" +
      (egg ? "letter-spacing:.08em;" : "") + "padding:10px 18px;border:2px solid #ffe14a;box-shadow:6px 6px 0 rgba(0,0,0,.25)");
    document.body.appendChild(d); setTimeout(function () { d.remove(); }, ms || 6000);
  }

  if (window.claude && window.claude.use) return;
  var h = location.hostname;
  var local = location.protocol === "http:" && (h === "localhost" || h === "127.0.0.1" || h === "[::1]" ||
    /^(192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h));
  if (!local) return;
  var H = { "Content-Type": "application/json", "X-Clawdfield": "1" };
  var enc = encodeURIComponent;
  var ABC = "abcdefghijklmnopqrstuvwxyz0123456789";
  function rid() { var s = ""; for (var i = 0; i < 20; i++) s += ABC[Math.floor(Math.random() * 36)]; return s; }
  function err(code, msg) { var e = new Error(msg || code); e.code = code; return e; }
  function req(method, url, body) {
    return fetch(url, { method: method, headers: H, body: body === undefined ? undefined : JSON.stringify(body) })
      .then(function (r) {
        if (r.ok) return r.json();
        return r.json().catch(function () { return {}; }).then(function (j) { throw err(j.code || ("http_" + r.status), j.message); });
      }, function () { throw err("offline", "本机小程序没开：请双击 start.bat"); });
  }
  function snapOf(docs) {
    return { docs: docs.map(function (d) { return { id: d.id, data: function () { return d.data; } }; }), size: docs.length, empty: !docs.length };
  }
  var subs = {}, es = null;
  function refresh(c) {
    var L = subs[c]; if (!L || !L.length) return;
    req("GET", "/api/db/" + enc(c)).then(function (j) {
      var s = snapOf(j.docs); L.slice().forEach(function (x) { x.ok(s); });
    }, function (e) { L.slice().forEach(function (x) { if (x.bad) x.bad(e); }); });
  }
  function ensureES() {
    if (es) return;
    es = new EventSource("/api/events");
    es.onmessage = function (e) { var m; try { m = JSON.parse(e.data); } catch (x) { return; } (m.c || []).forEach(refresh); };
    es.onopen = function () { Object.keys(subs).forEach(refresh); };  // 断线重连后补一次
  }
  function doc(c, id) {
    id = id || rid();
    var u = "/api/db/" + enc(c) + "/" + enc(id);
    return {
      id: id,
      set: function (d) { return req("PUT", u, d).then(function () {}); },
      update: function (d) { return req("PATCH", u, d).then(function () {}); },
      "delete": function () { return req("DELETE", u).then(function () {}); },
      get: function () { return req("GET", u).then(function (j) { return { id: id, exists: j.exists, data: function () { return j.data; } }; }); }
    };
  }
  function collection(c) {
    return {
      doc: function (id) { return doc(c, id); },
      get: function () { return req("GET", "/api/db/" + enc(c)).then(function (j) { return snapOf(j.docs); }); },
      onSnapshot: function (ok, bad) {
        (subs[c] = subs[c] || []).push({ ok: ok, bad: bad }); ensureES(); refresh(c);
        return function () { subs[c] = (subs[c] || []).filter(function (x) { return x.ok !== ok; }); };
      }
    };
  }
  var db = { collection: collection };
  var sample = {
    json: function (prompt, opts) {
      opts = opts || {};
      return req("POST", "/api/ai", { prompt: String(prompt), tier: opts.modelTier || "default", kind: "json" })
        .then(function (j) { return j.value; }, function (e) {
          // 没接 AI 的时候网页自己会提示；别的错误（Key 不对、没钱了、太快了……）在底下说一句人话
          if (e && e.code !== "not_granted") toast("✨ " + (e.message || "AI 出错了") + (e.code === "offline" ? "" : " · 去 " + location.host + "/setup 看看"), 7000);
          throw e;
        });
    }
  };
  window.claude = {
    local: true,
    use: function (name) {
      if (name === "db") return Promise.resolve(db);
      if (name === "sample") return Promise.resolve(sample);
      return Promise.reject(err("not_supported"));
    }
  };
})();
